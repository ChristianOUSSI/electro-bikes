<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0cc00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="48" fill="#09090b"/>
  
  <!-- 3D Bike Icon -->
  <g transform="translate(32, 32)" filter="url(#shadow)">
    <!-- Wheels -->
    <circle cx="32" cy="96" r="24" fill="url(#grad1)"/>
    <circle cx="32" cy="96" r="18" fill="#09090b"/>
    <circle cx="32" cy="96" r="8" fill="url(#grad1)"/>
    
    <circle cx="96" cy="96" r="24" fill="url(#grad1)"/>
    <circle cx="96" cy="96" r="18" fill="#09090b"/>
    <circle cx="96" cy="96" r="8" fill="url(#grad1)"/>
    
    <!-- Frame -->
    <path d="M32 72 L64 48 L96 48 L96 72 L80 88 L48 88 Z" fill="url(#grad1)"/>
    <path d="M64 48 L96 48 L96 72 L80 88 L48 88 L32 72" fill="url(#grad2)"/>
    
    <!-- Handlebar -->
    <rect x="56" y="32" width="8" height="16" rx="4" fill="url(#grad1)"/>
    
    <!-- Seat -->
    <ellipse cx="64" cy="56" rx="12" ry="6" fill="url(#grad1)"/>
    
    <!-- Electric bolt -->
    <path d="M48 16 L56 32 L64 24 L56 40 L64 56" fill="url(#grad1)"/>
  </g>
  
  <!-- Highlight -->
  <ellipse cx="96" cy="40" rx="40" ry="20" fill="url(#grad2)"/>
</svg>